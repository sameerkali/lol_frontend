<!-- @dsCard group="Type" viewport="700x150" subtitle="Uppercase eyebrows, buttons, and the one casing rule." name="Labels & buttons" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Labels & buttons</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);}
  body{padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:92px;height:56px;border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--pop-1);}
  .nm{font:var(--type-label);letter-spacing:.06em;color:var(--text-strong);}
  .hx{font:var(--type-mono);font-size:11px;color:var(--text-muted);}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);}
</style></head><body><div class="lbl">MILESTONE LADDER</div>
   <div style="display:flex;gap:10px;margin-top:12px;align-items:center">
     <span style="font:var(--type-button);background:var(--grape-500);color:#fff;border:var(--border);border-radius:var(--radius-pill);padding:12px 22px;box-shadow:var(--pop-1)">Mark my visit</span>
     <span style="font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;background:var(--sun-500);border:var(--border);border-radius:var(--radius-pill);padding:7px 14px;color:var(--ink-900)">UNLOCKED</span>
   </div>
   <div class="hx" style="margin-top:10px">Sentence case in sentences. UPPERCASE + 0.12em only for eyebrows and status pills.</div></body></html>
