<!-- @dsCard group="Colors" viewport="700x150" subtitle="Warm near-black ink over warm paper. Borders are always ink-900." name="Ink & Paper" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ink & Paper</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);}
  body{padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:92px;height:56px;border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--pop-1);}
  .nm{font:var(--type-label);letter-spacing:.06em;color:var(--text-strong);}
  .hx{font:var(--type-mono);font-size:11px;color:var(--text-muted);}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#1B1526"></div><div class="nm">ink-900</div><div class="hx">#1B1526</div></div><div class="sw"><div class="chip" style="background:#3A3049"></div><div class="nm">ink-700</div><div class="hx">#3A3049</div></div><div class="sw"><div class="chip" style="background:#6B6180"></div><div class="nm">ink-500</div><div class="hx">#6B6180</div></div><div class="sw"><div class="chip" style="background:#DBD5E3"></div><div class="nm">ink-100</div><div class="hx">#DBD5E3</div></div><div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="nm">paper-000</div><div class="hx">#FFFFFF</div></div><div class="sw"><div class="chip" style="background:#FDF3E3"></div><div class="nm">paper-100</div><div class="hx">#FDF3E3</div></div><div class="sw"><div class="chip" style="background:#F3E7D4"></div><div class="nm">paper-200</div><div class="hx">#F3E7D4</div></div></div></body></html>
