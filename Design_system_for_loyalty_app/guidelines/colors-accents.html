<!-- @dsCard group="Colors" viewport="700x150" subtitle="Mint, coral, sun, sky. Max three brand hues per viewport." name="Accents" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Accents</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);}
  body{padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:92px;height:56px;border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--pop-1);}
  .nm{font:var(--type-label);letter-spacing:.06em;color:var(--text-strong);}
  .hx{font:var(--type-mono);font-size:11px;color:var(--text-muted);}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#2FD9A8"></div><div class="nm">mint-500</div><div class="hx">#2FD9A8</div></div><div class="sw"><div class="chip" style="background:#FF6A55"></div><div class="nm">coral-500</div><div class="hx">#FF6A55</div></div><div class="sw"><div class="chip" style="background:#FFC93C"></div><div class="nm">sun-500</div><div class="hx">#FFC93C</div></div><div class="sw"><div class="chip" style="background:#35B6F5"></div><div class="nm">sky-500</div><div class="hx">#35B6F5</div></div><div class="sw"><div class="chip" style="background:#8DEFD0"></div><div class="nm">mint-300</div><div class="hx">#8DEFD0</div></div><div class="sw"><div class="chip" style="background:#FFB0A2"></div><div class="nm">coral-300</div><div class="hx">#FFB0A2</div></div><div class="sw"><div class="chip" style="background:#FFDF86"></div><div class="nm">sun-300</div><div class="hx">#FFDF86</div></div><div class="sw"><div class="chip" style="background:#9BDBFF"></div><div class="nm">sky-300</div><div class="hx">#9BDBFF</div></div></div></body></html>
