<!-- @dsCard group="Colors" viewport="700x150" subtitle="Tiers used when a business moves customers up instead of resetting." name="Tiers" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Tiers</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);}
  body{padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:92px;height:56px;border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--pop-1);}
  .nm{font:var(--type-label);letter-spacing:.06em;color:var(--text-strong);}
  .hx{font:var(--type-mono);font-size:11px;color:var(--text-muted);}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);}
</style></head><body><div class="row"><div style="display:flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;background:var(--paper-000);border:var(--border);border-radius:var(--radius-pill);box-shadow:var(--pop-1)"><span style="width:34px;height:34px;border-radius:50%;background:#CE7B4A;border:var(--border-hair)"></span><span style="font:var(--type-subtitle);color:var(--text-strong)">Bronze</span></div><div style="display:flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;background:var(--paper-000);border:var(--border);border-radius:var(--radius-pill);box-shadow:var(--pop-1)"><span style="width:34px;height:34px;border-radius:50%;background:#B6BECB;border:var(--border-hair)"></span><span style="font:var(--type-subtitle);color:var(--text-strong)">Silver</span></div><div style="display:flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;background:var(--paper-000);border:var(--border);border-radius:var(--radius-pill);box-shadow:var(--pop-1)"><span style="width:34px;height:34px;border-radius:50%;background:#FFC93C;border:var(--border-hair)"></span><span style="font:var(--type-subtitle);color:var(--text-strong)">Gold</span></div></div></body></html>
