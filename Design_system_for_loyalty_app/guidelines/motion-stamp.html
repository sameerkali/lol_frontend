<!-- @dsCard group="Brand" viewport="700x200" subtitle="lol-pop-in: 0.4 → 1.12 → 1, −12deg → 0. Like a rubber stamp." name="Stamp landing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Stamp landing</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);}
  body{padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:92px;height:56px;border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--pop-1);}
  .nm{font:var(--type-label);letter-spacing:.06em;color:var(--text-strong);}
  .hx{font:var(--type-mono);font-size:11px;color:var(--text-muted);}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);}
</style></head><body><style>
     .s{width:56px;height:56px;border-radius:50%;border:var(--border);background:var(--grape-500);animation:lol-pop-in var(--dur-slow) var(--ease-pop) both;}
     .e{width:56px;height:56px;border-radius:50%;border:var(--border);background:var(--paper-200);}
   </style>
   <div class="row" style="gap:10px" id="r">
     <div class="s" style="animation-delay:0ms"></div><div class="s" style="animation-delay:120ms"></div>
     <div class="s" style="animation-delay:240ms"></div><div class="e"></div><div class="e"></div>
   </div>
   <div class="hx" style="margin-top:14px">420ms · cubic-bezier(0.2, 1.4, 0.35, 1) · 120ms stagger</div>
   <script>setInterval(()=>{document.querySelectorAll('.s').forEach(n=>{n.style.animation='none';void n.offsetWidth;n.style.animation='';});},2600)</script></body></html>
