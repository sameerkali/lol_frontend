<!-- @dsCard group="Brand" viewport="700x170" subtitle="Nothing is square-cornered. Pills for actions, 24 for cards." name="Corner radii" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Corner radii</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);}
  body{padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:92px;height:56px;border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--pop-1);}
  .nm{font:var(--type-label);letter-spacing:.06em;color:var(--text-strong);}
  .hx{font:var(--type-mono);font-size:11px;color:var(--text-muted);}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);}
</style></head><body><div class="row"><div class="sw"><div style="width:96px;height:60px;background:var(--paper-000);border:var(--border);border-radius:6px"></div><div class="nm">xs</div><div class="hx">6px</div></div><div class="sw"><div style="width:96px;height:60px;background:var(--paper-000);border:var(--border);border-radius:10px"></div><div class="nm">sm</div><div class="hx">10px</div></div><div class="sw"><div style="width:96px;height:60px;background:var(--paper-000);border:var(--border);border-radius:16px"></div><div class="nm">md</div><div class="hx">16px</div></div><div class="sw"><div style="width:96px;height:60px;background:var(--paper-000);border:var(--border);border-radius:24px"></div><div class="nm">lg</div><div class="hx">24px</div></div><div class="sw"><div style="width:96px;height:60px;background:var(--paper-000);border:var(--border);border-radius:32px"></div><div class="nm">xl</div><div class="hx">32px</div></div><div class="sw"><div style="width:96px;height:60px;background:var(--paper-000);border:var(--border);border-radius:999px"></div><div class="nm">pill</div><div class="hx">999px</div></div></div></body></html>
