<!-- @dsCard group="Brand" viewport="700x180" subtitle="Hard offset ink only. No blur exists in the flat UI." name="Pop shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pop shadows</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);}
  body{padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:92px;height:56px;border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--pop-1);}
  .nm{font:var(--type-label);letter-spacing:.06em;color:var(--text-strong);}
  .hx{font:var(--type-mono);font-size:11px;color:var(--text-muted);}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);}
</style></head><body><div class="row" style="gap:24px;padding:4px 4px 14px"><div class="sw"><div style="width:104px;height:64px;background:var(--paper-000);border:var(--border);border-radius:var(--radius-md);box-shadow:3px 3px 0 var(--line)"></div><div class="nm">pop-1</div><div class="hx">3px 3px 0 ink</div></div><div class="sw"><div style="width:104px;height:64px;background:var(--paper-000);border:var(--border);border-radius:var(--radius-md);box-shadow:5px 5px 0 var(--line)"></div><div class="nm">pop-2</div><div class="hx">5px 5px 0 ink</div></div><div class="sw"><div style="width:104px;height:64px;background:var(--paper-000);border:var(--border);border-radius:var(--radius-md);box-shadow:8px 8px 0 var(--line)"></div><div class="nm">pop-3</div><div class="hx">8px 8px 0 ink</div></div><div class="sw"><div style="width:104px;height:64px;background:var(--paper-000);border:var(--border);border-radius:var(--radius-md);box-shadow:1px 1px 0 var(--line)"></div><div class="nm">pressed</div><div class="hx">1px 1px 0 ink</div></div></div></body></html>
