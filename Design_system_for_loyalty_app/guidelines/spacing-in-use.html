<!-- @dsCard group="Spacing" viewport="700x200" subtitle="A card at rest: 24px padding, 16px stack, 12px tight." name="Spacing in use" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing in use</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);}
  body{padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:92px;height:56px;border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--pop-1);}
  .nm{font:var(--type-label);letter-spacing:.06em;color:var(--text-strong);}
  .hx{font:var(--type-mono);font-size:11px;color:var(--text-muted);}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);}
</style></head><body><div style="max-width:340px;background:var(--surface-card);border:var(--border);border-radius:var(--radius-lg);box-shadow:var(--pop-2);padding:24px">
     <div class="lbl">NEXT MILESTONE</div>
     <div style="font:var(--type-title);letter-spacing:var(--tracking-display);color:var(--text-strong);margin-top:12px">Free coffee</div>
     <div style="font:var(--type-body);margin-top:16px">2 more visits</div>
   </div></body></html>
