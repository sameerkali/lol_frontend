<!DOCTYPE html><html><head><meta charset="utf-8"><title>Wordmark placeholder</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);}
  body{padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:92px;height:56px;border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--pop-1);}
  .nm{font:var(--type-label);letter-spacing:.06em;color:var(--text-strong);}
  .hx{font:var(--type-mono);font-size:11px;color:var(--text-muted);}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);}
</style></head><body><div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
     <div style="font:900 76px/0.8 var(--font-display);letter-spacing:-0.03em;color:var(--ink-900)">lol<span style="color:var(--coral-500)">.</span></div>
     <div style="font:var(--type-body-sm);color:var(--text-muted);max-width:380px">No brand mark exists in the sources. Wherever a logo belongs, the wordmark is set in Darker Grotesque 900 with a coral full stop. <strong>Send the real mark and this gets replaced.</strong></div>
   </div></body></html>
