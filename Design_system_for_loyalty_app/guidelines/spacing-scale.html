<!-- @dsCard group="Spacing" viewport="700x170" subtitle="4px base. 16 is the default gap, 24 between groups, 32 between sections." name="Scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Scale</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);}
  body{padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:92px;height:56px;border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--pop-1);}
  .nm{font:var(--type-label);letter-spacing:.06em;color:var(--text-strong);}
  .hx{font:var(--type-mono);font-size:11px;color:var(--text-muted);}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);}
</style></head><body><div style="display:flex;gap:14px;align-items:flex-end"><div class="sw" style="align-items:center"><div style="width:4px;height:4px;background:var(--grape-500);border:var(--border-hair);border-radius:3px"></div><div class="hx">4</div></div><div class="sw" style="align-items:center"><div style="width:8px;height:8px;background:var(--grape-500);border:var(--border-hair);border-radius:3px"></div><div class="hx">8</div></div><div class="sw" style="align-items:center"><div style="width:12px;height:12px;background:var(--grape-500);border:var(--border-hair);border-radius:3px"></div><div class="hx">12</div></div><div class="sw" style="align-items:center"><div style="width:16px;height:16px;background:var(--grape-500);border:var(--border-hair);border-radius:3px"></div><div class="hx">16</div></div><div class="sw" style="align-items:center"><div style="width:24px;height:24px;background:var(--grape-500);border:var(--border-hair);border-radius:3px"></div><div class="hx">24</div></div><div class="sw" style="align-items:center"><div style="width:32px;height:32px;background:var(--grape-500);border:var(--border-hair);border-radius:3px"></div><div class="hx">32</div></div><div class="sw" style="align-items:center"><div style="width:48px;height:48px;background:var(--grape-500);border:var(--border-hair);border-radius:3px"></div><div class="hx">48</div></div><div class="sw" style="align-items:center"><div style="width:64px;height:64px;background:var(--grape-500);border:var(--border-hair);border-radius:3px"></div><div class="hx">64</div></div></div>
   <div class="hx" style="margin-top:14px">--sp-1 … --sp-8</div></body></html>
