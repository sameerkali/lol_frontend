<!-- @dsCard group="Colors" viewport="700x160" subtitle="The four states a single stamp can be in." name="Stamp states" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Stamp states</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);}
  body{padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:92px;height:56px;border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--pop-1);}
  .nm{font:var(--type-label);letter-spacing:.06em;color:var(--text-strong);}
  .hx{font:var(--type-mono);font-size:11px;color:var(--text-muted);}
  .lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);}
</style></head><body><div class="row" style="gap:20px"><div class="sw" style="align-items:center"><div style="width:64px;height:64px;border-radius:50%;background:var(--paper-200);border:var(--border);box-shadow:var(--pop-1)"></div><div class="nm">empty</div><div class="hx">not yet</div></div><div class="sw" style="align-items:center"><div style="width:64px;height:64px;border-radius:50%;background:var(--grape-500);border:var(--border);box-shadow:var(--pop-1)"></div><div class="nm">filled</div><div class="hx">earned</div></div><div class="sw" style="align-items:center"><div style="width:64px;height:64px;border-radius:50%;background:var(--mint-300);border:var(--border);box-shadow:var(--pop-1)"></div><div class="nm">next</div><div class="hx">next up</div></div><div class="sw" style="align-items:center"><div style="width:64px;height:64px;border-radius:50%;background:var(--sun-500);border:var(--border);box-shadow:var(--pop-1)"></div><div class="nm">reward</div><div class="hx">milestone</div></div></div></body></html>
