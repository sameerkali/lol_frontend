<!-- @startingPoint section="Screens" subtitle="Mobile customer stamp card, click-through" viewport="420x860" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>LOL — Customer page</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html,body{margin:0;background:var(--paper-200);font:var(--type-body);color:var(--text-body);}
  #root{display:grid;place-items:start center;padding:0;}
  [data-lucide]{stroke-width:2.25;}
  *{-webkit-tap-highlight-color:transparent;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = (() => {
  for (const k of Object.keys(window)) {
    const v = window[k];
    if (v && typeof v === 'object' && v.CustomerApp) return v;
  }
  return window.DS || {};
})();
const { CustomerApp } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(<CustomerApp ns={NS} />);
const paint = () => window.lucide && window.lucide.createIcons({ nameAttr: 'data-lucide' });
setInterval(paint, 400);
</script></body></html>
